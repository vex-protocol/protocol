packages:
    - apps/*
    - packages/*

blockExoticSubdeps: true

catalog:
    "@simplewebauthn/server": ^13.3.2
    "@types/node": ^26.2.0
    kysely: ^0.29.5
    msgpackr: ^2.0.5
    tsx: 4.23.12
    typescript: 7.0.2
    uuid: ^14.0.1
    vitest: 4.1.10
    zod: ^4.4.3

catalogMode: strict

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
    - "@vex-chat/cli"
    - "@vex-chat/crypto"
    - "@vex-chat/libvex"
    - "@vex-chat/spire"
    - "@vex-chat/types"

onlyBuiltDependencies:
    - argon2
    - better-sqlite3
    - esbuild
    - msgpackr-extract

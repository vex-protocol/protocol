packages:
    - apps/*
    - packages/*

blockExoticSubdeps: true

catalog:
    "@simplewebauthn/server": ^13.3.2
    "@types/node": ^25.6.0
    kysely: ^0.29.4
    msgpackr: ^2.0.4
    tsx: 4.23.1
    typescript: 7.0.2
    uuid: ^14.0.1
    vitest: 4.1.10
    zod: ^4.4.3

catalogMode: strict

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
    - "@vex-chat/cli"
    - "@vex-chat/crypto"
    - "@vex-chat/libvex"
    - "@vex-chat/spire"
    - "@vex-chat/types"

onlyBuiltDependencies:
    - argon2
    - better-sqlite3
    - esbuild
    - msgpackr-extract

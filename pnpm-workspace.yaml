packages:
    - apps/*
    - packages/*

blockExoticSubdeps: true

catalog:
    "@simplewebauthn/server": ^13.3.0
    "@types/node": ^26.4.1
    kysely: ^0.29.5
    msgpackr: ^2.1.0
    tsx: 4.23.13
    typescript: 7.0.2
    uuid: ^14.0.2
    vitest: 4.1.4
    zod: ^4.5.4

catalogMode: strict

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
    - "@vex-chat/cli"
    - "@vex-chat/crypto"
    - "@vex-chat/libvex"
    - "@vex-chat/spire"
    - "@vex-chat/types"

onlyBuiltDependencies:
    - argon2
    - better-sqlite3
    - esbuild
    - msgpackr-extract
